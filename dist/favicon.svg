<svg width="96" height="96" viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background -->
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#090a0a"/>
      <stop offset="100%" stop-color="#090a0a"/>
    </linearGradient>

    <!-- Neon green -->
    <linearGradient id="accentGreen" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#c8fe0e"/>
      <stop offset="100%" stop-color="#c8fe0e"/>
    </linearGradient>

    <!-- Red accent -->
    <linearGradient id="accentRed" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#d94c44"/>
      <stop offset="100%" stop-color="#d94c44"/>
    </linearGradient>

    <!-- Stronger glow -->
    <filter id="glowGreen">
      <feGaussianBlur stdDeviation="1.8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="glowRed">
      <feGaussianBlur stdDeviation="1.6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <style>
      .orbit {
        transform-origin: 32px 32px;
        animation: spin 7s linear infinite;
      }

      .orbit2 {
        transform-origin: 32px 32px;
        animation: spinReverse 12s linear infinite;
      }

      @keyframes spin {
        from { transform: rotate(0deg); }
        to { transform: rotate(360deg); }
      }

      @keyframes spinReverse {
        from { transform: rotate(360deg); }
        to { transform: rotate(0deg); }
      }
    </style>
  </defs>

  <!-- Background (slightly larger feel via visual weight) -->
  <rect x="4" y="4" width="56" height="56" rx="16" fill="url(#bg)"/>

  <!-- MAIN ORBIT (bigger stroke = more visible) -->
  <g class="orbit">
    <path d="M16 38
             C8 24, 18 12, 32 12
             C46 12, 56 24, 48 38
             C40 52, 24 52, 16 38Z"
          fill="none"
          stroke="url(#accentGreen)"
          stroke-width="2.4"
          opacity="0.95"
          filter="url(#glowGreen)"/>
  </g>

  <!-- SECOND ORBIT -->
  <g class="orbit2">
    <path d="M18 42
             C12 28, 22 16, 32 16
             C44 16, 52 28, 46 40"
          fill="none"
          stroke="url(#accentRed)"
          stroke-width="1.6"
          stroke-linecap="round"
          opacity="0.9"
          filter="url(#glowRed)"/>
  </g>

  <!-- MONOGRAM (bigger + more readable) -->
  <text x="50%" y="55%" text-anchor="middle"
        font-size="24"
        font-family="Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto"
        font-weight="700"
        letter-spacing="2"
        fill="#c8fe0e">
    SZ
  </text>

  <!-- Center dot (slightly bigger for visibility) -->
  <circle cx="32" cy="32" r="1.6" fill="#d94c44"/>
</svg>